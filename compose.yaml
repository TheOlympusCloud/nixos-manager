# docker compose up -d --build   (see README.md for the first-time setup)
services:
  nixos-manager:
    build: .
    restart: unless-stopped
    depends_on:
      data-owner:
        condition: service_completed_successfully
    ports:
      - "8080:8080" # LAN and Tailscale reach it through the host
    environment:
      NIXMGR_AUTHOR_NAME: "Your Name" # every commit is made as this person
      NIXMGR_AUTHOR_EMAIL: "you@example.com"
      NIXMGR_PASSWORD_HASH_FILE: /run/secrets/nixmgr/password-hash
      # TZ: "Europe/Madrid" # the clock of the update schedule in Inputs (default UTC)
      # With `tailscale serve` or another proxy on the host, the container sees it as the
      # Docker gateway; name it so login limits count each client (the remote= of login log lines):
      # NIXMGR_TRUSTED_PROXIES: "172.18.0.1"
      # Uncomment once the Forgejo repository exists (SSH deploy key with write access):
      # NIXMGR_REMOTE: "ssh://git@forgejo.lan:2222/pablo/nixos-config.git"
    volumes:
      - nixmgr-data:/var/lib/nixos-manager
      - ./secrets:/run/secrets/nixmgr:ro
      # - ./secrets/ssh:/home/nixos-manager/.ssh:ro   # id_ed25519 + known_hosts for the Forgejo remote, readable by uid 10001
  # Runs before the server, once per start, as root but in a container of its own (the
  # server's never runs anything as root): it gives the data volume to the image's user.
  # Volumes of images before it ran as that user are root-owned.
  data-owner:
    build: .
    user: root
    entrypoint: ["chown", "-R", "-h", "nixos-manager:nixos-manager", "/var/lib/nixos-manager"]
    volumes:
      - nixmgr-data:/var/lib/nixos-manager
volumes:
  nixmgr-data:
