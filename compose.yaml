# docker compose up -d --build   (see README.md for the first-time setup)
services:
  nixos-manager:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080" # LAN and Tailscale reach it through the host
    environment:
      NIXMGR_AUTHOR_NAME: "Your Name" # every commit is made as this person
      NIXMGR_AUTHOR_EMAIL: "you@example.com"
      NIXMGR_PASSWORD_HASH_FILE: /run/secrets/nixmgr/password-hash
      # Uncomment once the Forgejo repository exists (SSH deploy key with write access):
      # NIXMGR_REMOTE: "ssh://git@forgejo.lan:2222/pablo/nixos-config.git"
    volumes:
      - nixmgr-data:/var/lib/nixos-manager
      - ./secrets:/run/secrets/nixmgr:ro
      # - ./secrets/ssh:/home/nixos-manager/.ssh:ro   # id_ed25519 + known_hosts for the Forgejo remote, readable by uid 10001
volumes:
  nixmgr-data:
